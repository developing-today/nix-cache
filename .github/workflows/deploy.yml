name: Deploy nix-cache Worker version

on:
  workflow_dispatch:
    inputs:
      action:
        description: Upload an inactive version, or activate an exact uploaded version
        type: choice
        required: true
        options:
          - upload
          - activate
      version_id:
        description: Exact Cloudflare version UUID (required for activate)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nix-cache-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'developing-today/nix-cache' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate request and build output
        env:
          ACTION_KIND: ${{ inputs.action }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          if [[ "$ACTION_KIND" == upload ]]; then
            [[ -z "$VERSION_ID" ]]
          elif [[ "$ACTION_KIND" == activate ]]; then
            [[ "$VERSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          else
            exit 2
          fi
          npx --no-install cf build --mode production
          npx --no-install cf workers versions create --prebuilt --mode production --worker nix-cache --dry-run
          if [[ "$ACTION_KIND" == activate ]]; then
            npx --no-install cf workers triggers deploy --prebuilt --mode production --worker nix-cache --dry-run
          fi

      - name: Upload inactive version
        if: inputs.action == 'upload'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ && -n "$CLOUDFLARE_API_TOKEN" ]]
          sha="$GITHUB_SHA"
          tag="git-${sha:0:12}"
          npx --no-install cf workers versions create \
            --prebuilt --mode production --worker nix-cache \
            --tag "$tag" --message "nix-cache candidate $sha"
          npx --no-install cf -q workers versions list --worker-id nix-cache > "$RUNNER_TEMP/versions.json"
          python3 - "$RUNNER_TEMP/versions.json" "$tag" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          versions = data if isinstance(data, list) else data.get("result", data.get("versions", []))
          if isinstance(versions, dict):
              versions = versions.get("items", [])
          matches = [v for v in versions if v.get("annotations", {}).get("workers/tag") == sys.argv[2]]
          if not matches:
              raise SystemExit("Cloudflare did not list the version with the exact commit tag")
          matches.sort(key=lambda v: v.get("metadata", {}).get("created_on", ""), reverse=True)
          version_id = matches[0].get("id")
          if not isinstance(version_id, str):
              raise SystemExit("Tagged version has no ID")
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write(f"Uploaded inactive candidate version `{version_id}` for `{sys.argv[2]}`.\n")
          print(version_id)
          PY

          version="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));vs=d if isinstance(d,list) else d.get("result",d.get("versions",[]));vs=vs.get("items",[]) if isinstance(vs,dict) else vs;tag=sys.argv[2];m=[v for v in vs if v.get("annotations",{}).get("workers/tag")==tag];m.sort(key=lambda v:v.get("metadata",{}).get("created_on",""),reverse=True);print(m[0]["id"])' "$RUNNER_TEMP/versions.json" "$tag")"
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nix-cache/versions?deployable=true" \
            > "$RUNNER_TEMP/deployable.json"
          python3 - "$RUNNER_TEMP/deployable.json" "$version" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          versions = data.get("result", [])
          if isinstance(versions, dict):
              versions = versions.get("items", [])
          if not data.get("success") or sys.argv[2] not in [v.get("id") for v in versions]:
              raise SystemExit("Uploaded version is not in Cloudflare's deployable version set")
          PY
          echo "Candidate version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact version is deployable
        if: inputs.action == 'activate'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ && -n "$CLOUDFLARE_API_TOKEN" ]]
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nix-cache/versions?deployable=true" \
            > "$RUNNER_TEMP/deployable.json"
          python3 - "$RUNNER_TEMP/deployable.json" "$VERSION_ID" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          versions = data.get("result", [])
          if isinstance(versions, dict):
              versions = versions.get("items", [])
          if not data.get("success") or sys.argv[2] not in [v.get("id") for v in versions]:
              raise SystemExit("Exact requested version is not deployable for nix-cache")
          PY

      - name: Activate the exact version at 100 percent
        if: inputs.action == 'activate'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          npx --no-install cf workers deployments create \
            --worker nix-cache --strategy percentage \
            --versions "[{\"version_id\":\"$VERSION_ID\",\"percentage\":100}]"

      - name: Apply the configured public route, Queue consumer, and Cron trigger
        if: inputs.action == 'activate'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --no-install cf workers triggers deploy \
            --prebuilt --mode production --worker nix-cache

      - name: Verify active version read-back
        if: inputs.action == 'activate'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          set -euo pipefail
          npx --no-install cf -q workers deployments list --worker nix-cache > "$RUNNER_TEMP/deployments.json"
          python3 - "$RUNNER_TEMP/deployments.json" "$VERSION_ID" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = data if isinstance(data, list) else data.get("result", data.get("deployments", []))
          if isinstance(rows, dict):
              rows = rows.get("items", [])
          found = [row for row in rows if any(
              version.get("version_id") == sys.argv[2] and int(version.get("percentage", 0)) == 100
              for version in row.get("versions", [])
          )]
          if not found:
              raise SystemExit("Deployment read-back did not confirm the exact version at 100 percent")
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write(f"Activated `{sys.argv[2]}` and verified deployment read-back at 100%.\n")
          PY
